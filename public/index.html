q0:`What is UdyamSetu?`,a0:`UdyamSetu is a student-project prototype that helps people find government-supported financial schemes, check if they fit, estimate repayments and find where to apply.`,
q1:`Is it an official government website?`,a1:`No. It is independent and has no government affiliation or endorsement.`,
q2:`Does UdyamSetu provide loans?`,a2:`No. Loans and approvals are decided only by the agency you apply through.`,
q3:`Does "You fit" guarantee a loan?`,a3:`No. It means your answers meet the rules published on the NSFDC website. The agency makes the final decision.`,
q4:`What are the basic rules?`,a4:`You must be a Scheduled Caste applicant. For loan schemes, yearly family income must be up to ₹5 lakh (from 7 Jan 2026). Skill training has no income limit.`,
q5:`How is EMI calculated?`,a5:`EMI = P × r × (1+r)^n ÷ ((1+r)^n − 1), where P is the loan, r the rate per period and n the number of instalments. It is only an estimate.`,
q6:`What is a moratorium?`,a6:`A period at the start of a loan when you do not have to start repaying. Each scheme page lists its own moratorium.`,
q7:`How do I apply?`,a7:`NSFDC does not take direct applications. Apply through the State Channelising Agency or partner shown for your scheme. Use Find a partner.`,
q8:`How is my information protected?`,a8:`Your eligibility answers stay in your browser. Only if you create an account, your name, email, saved schemes and document checklist are stored on the server (the password is stored only as a secure hash). We never ask for Aadhaar, OTP or bank details.`,
fAst:`Assistant and FAQ`,fPriv:`Privacy: your eligibility answers stay in your browser. If you create an account, only your name, email, a securely hashed password, saved schemes and document checklist are stored on our server. Contact details will be added once configured.`,disc:`UdyamSetu is an independent student-project prototype. It is not an official government website and does not provide or guarantee loans, government benefits, eligibility, or approval. Scheme information is provided for discovery and educational purposes. Users should verify current eligibility, terms, and application procedures with the relevant official agency.`,

/* ===== matching (rules from NSFDC pages) ===== */
function match(s){const no=[],inc=+A.inc,cost=+A.cost||0,fund=+A.fund||0;
if(A.cat!=='sc')no.push(t('rSc',t(CATK[A.cat])));
if(s.k!=='skill'&&inc>500000)no.push(t('rInc'));
if(!s.p.includes(A.pu))no.push(t('rPur',s.p.map(x=>t(PUR[x]).toLowerCase()).join(' / '),t(PUR[A.pu]).toLowerCase()));
else{if(s.k==='loan'){if(s.max&&cost>s.max)no.push(t('rMax',inr(s.max)));if(s.min&&cost<=s.min)no.push(t('rMin',inr(s.min)))}
if(s.k==='edu'&&A.edu!=='studying')no.push(t('rEdu'))}
if(no.length)return {s,fit:false,txt:t('notFit',no.join(t('and')))};
let txt=t('fSc')+(s.k!=='skill'?t('fInc'):'')+(s.k==='loan'?t('fCost'):'')+(s.k==='edu'?t('fEdu'):'')+t('dot'),lim=0,n='';
if(s.k!=='skill'){lim=Math.min(.9*cost,s.cap);n=fund>lim?t('lim1',inr(lim)):t('lim2',inr(fund),inr(lim))}
return {s,fit:true,txt,n,lim}}
function runMatch(){resShown=true;const r=S.map(match),f=r.filter(x=>x.fit),nf=r.filter(x=>!x.fit),fund=+A.fund||0;$('#q').style.display='none';
let best=null;if(f.length){const ln=f.filter(x=>x.s.rate!==undefined);if(ln.length){const cov=ln.filter(x=>x.lim>=fund);best=[...(cov.length?cov:ln)].sort((a,b)=>a.s.rate-b.s.rate||b.lim-a.lim)[0]}else best=f[0]}
f.sort((a,b)=>(b===best)-(a===best));
const card=x=>x.fit?`<div class="card res${x===best?' bp':''}"><div>${x===best?`<span class="tag wn">★ ${t('best')}</span>`:''}</div><div class="big g">${t('fitT')}</div><h3>${x.s.n}</h3><p class="sm"><b>${t('whyL')}</b> ${x.txt}</p>${x.n?`<p class="sm">${x.n}</p>`:''}${x===best?`<p class="sm mut">${t(x.s.rate!==undefined?'bestW':'bestO')}</p>`:''}<p class="sm mut">${t('applyV',t('via_'+x.s.via))}</p><div class="acts" style="margin-top:12px"><button class="btn p sb" data-ptn="${x.s.id}">${t('findP')}</button><button class="btn s sb" data-det="${x.s.id}">${t('viewDet')}</button>${x.s.k==='skill'?'':`<button class="btn s sb" data-emi="${x.s.id}" data-amt="${Math.min(fund,x.lim)}">${t('estEmi')}</button>`}<button class="btn s sb" data-sv="${x.s.id}">${t(saved.includes(x.s.id)?'saved':'save')}</button></div></div>`:`<div class="card res x"><div class="big r">${t('nofitT')}</div><h3>${x.s.n}</h3><p class="sm"><b>${t('whyL')}</b> ${x.txt}</p></div>`;
$('#res').innerHTML=`<h3 style="margin:8px 0 20px">${f.length?t('goodN',f.length):t('noneFit')}</h3><div class="grid">${f.map(card).join('')}${nf.map(card).join('')}</div><p class="sm mut" style="margin-top:20px">${t('resNote')}</p><div class="acts"><button class="btn s" id="rs">${t('again')}</button></div>`;

function fillScheme(){const s=sch($('#es').value);$('#ecap').textContent='';$('#enote').textContent='';if(!s)return;
$('#er').value=s.rate;$('#et').value=s.inc?s.ten:s.ten+s.mor;$('#eu').value='m';$('#em').value=s.mor;$('#ef').value=s.fq;$('#ecap').textContent=t('capNote',inr(s.cap));if(s.id==='el')$('#enote').textContent=t('elNote')}
function setCalc(id,amt){$('#es').value=id;fillScheme();if(amt)$('#ea').value=Math.round(amt);allRows=false;show('emi');emi()}
function emi(){const s=sch($('#es').value),P0=+$('#ea').value,R=+$('#er').value,fq=$('#ef').value,step=fq==='q'?3:1;let tot=+$('#et').value;if($('#eu').value==='y')tot*=12;const mor=+$('#em').value,er=$('#ee'),cap=$('#eh').value==='a';
$('#eol').textContent=t(fq==='q'?'estQ':'estM');
$('#sh').innerHTML=['thP','thE','thPr','thI','thB'].map(k=>`<th>${t(k)}${k==='thP'?' ('+t(fq==='q'?'pq':'pm')+')':''}</th>`).join('');
if(s&&P0>s.cap){er.textContent=t('eMax',inr(s.cap));return}
if(!(P0>0)||!(R>=0)||!(tot>=1)||tot!==Math.floor(tot)||!(mor>=0)||mor>=tot){er.textContent=t('eBad');return}er.textContent='';
const r=R/1200*step,mp=Math.ceil(mor/step),n=Math.ceil((tot-mor)/step);let bal=P0,paid=0,idx=0;const rows=[];
for(let i=0;i<mp;i++){idx++;const it=bal*r;if(cap){bal+=it;rows.push([idx,0,0,it,bal,1])}else{paid+=it;rows.push([idx,it,0,it,bal,1])}}
const E=r===0?bal/n:bal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
for(let i=0;i<n;i++){idx++;const it=bal*r,pr=E-it;bal=Math.max(0,bal-pr);paid+=E;rows.push([idx,E,pr,it,bal,0])}
$('#eo').textContent=inr(E);$('#ep').textContent=inr(P0);$('#ei').textContent=inr(paid-P0);$('#et2').textContent=inr(paid);$('#dc').setAttribute('stroke-dasharray',(P0/paid*100)+' '+(100-P0/paid*100));
const lim=allRows?rows.length:Math.max(12,mp);
$('#sch').innerHTML=rows.slice(0,lim).map(x=>`<tr class="${x[5]?'mo':''}"><td>${x[0]}${x[5]?' ('+t('moRow')+')':''}</td><td>${inr(x[1])}</td><td>${inr(x[2])}</td><td>${inr(x[3])}</td><td>${inr(x[4])}</td></tr>`).join('');
$('#sm').style.display=rows.length>lim||allRows?'':'none';$('#sm').textContent=t(allRows?'showFirst':'showAll')}
['#ea','#er','#et','#eu','#em','#eh','#ef'].forEach(i=>$(i).oninput=()=>{emi()});
$('#es').onchange=()=>{fillScheme();emi()};$('#sm').onclick=()=>{allRows=!allRows;emi()};

/* ===== partner finder with map and nearest ===== */
let mapObj=null,mapLayer=null,hideBad=false,userPt=null;
const dist=(a,b,c,d)=>{const p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const demo=n=>{let h=0;for(const c of n)h+=c.charCodeAt(0);h%=10;return h<5?0:h<8?1:2};
function rPs(){const a=$('#ps').value,b=$('#pc').value;$('#ps').innerHTML=ST.map(s=>`<option>${s}</option>`).join('');$('#pc').innerHTML=S.map(s=>`<option value="${s.id}">${s.n}</option>`).join('');if(a)$('#ps').value=a;if(b)$('#pc').value=b}
function rPo(){$('#po').innerHTML=PTL.map(p=>`<a class="btn s sb" href="${p[1]}" target="_blank" rel="noopener">${t(p[0])}</a>`).join('')+`<a class="btn s sb" href="${CPURL}" target="_blank" rel="noopener">${t('allCp')}</a>`}
function drawMap(list){const el=$('#map'),n=$('#mapn');if(!list.length){el.style.display='none';n.style.display='none';return}
el.style.display='block';n.style.display='block';
if(!window.L){el.innerHTML=`<p style="padding:24px">${t('mapFail')}</p>`;return}
if(!mapObj){mapObj=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(mapObj);mapObj.attributionControl.setPrefix('Leaflet');mapLayer=L.layerGroup().addTo(mapObj)}
mapLayer.clearLayers();const pts=[];
list.forEach(x=>{L.circleMarker([x.la,x.lo],{radius:10,color:'#0a5cc4',fillColor:'#1faa59',fillOpacity:.85,weight:3}).bindPopup(`<b>${esc(x.n)}</b><br>${esc(x.ad)}`).addTo(mapLayer);pts.push([x.la,x.lo])});
if(userPt){L.circleMarker(userPt,{radius:8,color:'#fff',fillColor:'#e11d48',fillOpacity:1,weight:3}).addTo(mapLayer);pts.push(userPt)}
setTimeout(()=>{mapObj.invalidateSize();pts.length>1?mapObj.fitBounds(pts,{padding:[40,40],maxZoom:10}):mapObj.setView(pts[0],9)},60)}
function agCard(x){const d=demo(x.n),dc=['ok','wn','no'][d],dk=['dGood','dWatch','dBad'][d];
return `<div class="card"><h3>${esc(x.n)}</h3><p class="sm mut">${esc(x.ad)}</p>${x.km!==undefined?`<p class="sm"><b>${t('away',Math.round(x.km))}</b></p>`:''}<p><span class="tag ${dc}">${t(dk)}</span></p><div class="acts" style="margin-top:8px"><a class="btn s sb" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.n+', '+x.ad)}" target="_blank" rel="noopener">${t('openMaps')}</a></div></div>`}
function renderP(){const st=$('#ps').value,s=sch($('#pc').value),btn=(u,k)=>`<a class="btn s sb" href="${u}" target="_blank" rel="noopener">${t(k)}</a>`;let h='',list=[];
if(partShown==='loc'&&userPt){list=SCA.map(x=>({...x,km:dist(userPt[0],userPt[1],x.la,x.lo)})).sort((a,b)=>a.km-b.km).slice(0,6);h=`<h3>${t('nearT')}</h3>`}
else if(s.sca){list=SCA.filter(x=>x.st===st);if(!list.length){drawMap([]);$('#pr').innerHTML=`<div class="card"><h3>${t('noAg',esc(st))}</h3><p class="sm">${t('noAgD')}</p><div class="acts">${btn(CPURL,'ncp')}</div></div>`;return}h=`<h3>${t('agIn',esc(st),s.n)}</h3>`}
else{drawMap([]);$('#pr').innerHTML=s.k==='edu'?`<div class="card"><h3>${t('apT')}</h3><p class="sm">${t('apD')}</p><div class="acts">${btn(s.apply,'apB')}</div></div>`:s.pdf?`<div class="card"><h3>${s.n}</h3><p class="sm">${t('pdfD',t('via_'+s.via))}</p><div class="acts">${btn(s.pdf,'pdfB')}${btn(CPURL,'allCp')}</div></div>`:`<div class="card"><h3>${t('skT')}</h3><p class="sm">${t('skD')}</p><div class="acts">${btn(s.url,'skB')}</div></div>`;return}
list.sort((a,b)=>(demo(a.n)===2)-(demo(b.n)===2)||(a.km||0)-(b.km||0));const shown=hideBad?list.filter(x=>demo(x.n)<2):list;
drawMap(shown);
$('#pr').innerHTML=h+`<div class="card" style="margin:16px 0;border-color:var(--amber)"><b>${t('demoT')}</b><p class="sm mut" style="margin:6px 0 0">${t('demoNote')}</p><label class="chk"><input type="checkbox" id="dh"${hideBad?' checked':''}>${t('demoHide')}</label></div><div class="grid">${shown.map(agCard).join('')}</div><p class="sm mut" style="margin-top:20px">${t('srcNote')} <a href="${SCAPDF}" target="_blank" rel="noopener">${t('viewList')}</a></p>`;
$('#dh').onchange=e=>{hideBad=e.target.checked;renderP()}}
$('#pg').onclick=()=>{partShown='state';userPt=null;$('#pm').textContent='';renderP()};
$('#pl').onclick=()=>{$('#pm').textContent=t('locWait');if(!navigator.geolocation){$('#pm').textContent=t('locErr');return}
navigator.geolocation.getCurrentPosition(p=>{userPt=[p.coords.latitude,p.coords.longitude];partShown='loc';$('#pm').textContent='';renderP()},()=>{$('#pm').textContent=t('locErr')},{timeout:10000})};

/* ===== assistant ===== */
function rAsst(){const b=$('#an').dataset.q;$('#ch').innerHTML=[0,1,2,3,4,5,6,7,8].map(i=>`<button class="chip" data-q="${i}">${t('q'+i)}</button>`).join('');$('#faq').innerHTML=[0,1,2,3,4,5,6,7,8].map(i=>`<details><summary>${t('q'+i)}</summary><p>${t('a'+i)}</p></details>`).join('');$('#an').textContent=b?t('a'+b):t('pickQ')}
$('#ch').onclick=e=>{const b=e.target.closest('[data-q]');if(b){$('#an').dataset.q=b.dataset.q;$('#an').textContent=t('a'+b.dataset.q)}};

/* ===== account (backend: /api/*) ===== */
let reg=false;const dg=$('#dg');
const ERRK={exists:'eExists',credentials:'eCred',rate:'eRate'};
async function api(path,method,body){
  let r;try{r=await fetch('/api/'+path,{method:method||'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'})}catch(e){return{ok:false,data:{error:'net'}}}
  let j={};try{j=await r.json()}catch(e){}
  return{ok:r.ok,status:r.status,data:j}}
let syncT=null;
function pushData(){if(!uname)return;clearTimeout(syncT);syncT=setTimeout(()=>{api('data','PUT',{saved:saved,docs:docSt})},400)}
function saveLocal(){try{localStorage.setItem('us_saved',JSON.stringify(saved));localStorage.setItem('us_docs',JSON.stringify(docSt))}catch(e){}}
async function loadAccount(merge){
  const r=await api('data');if(!r.ok)return;
  const d=r.data;
  saved=[...new Set([...(d.saved||[]),...(merge?saved:[])])];
  docSt=Object.assign({},merge?docSt:{},d.docs||{});
  saveLocal();if(merge)pushData();
  rS();if(cur==='detail'&&curDet)detail(curDet)}
function rUa(){$('#ua').innerHTML=uname?`<span class="sm" id="un2"></span><button class="btn s sb" id="lo">${t('logout')}</button>`:`<button class="l" id="bl">${t('login')}</button><button class="btn p sb" id="br">${t('register')}</button>`;
if(uname){$('#un2').textContent=t('hiU',uname);$('#lo').onclick=async()=>{clearTimeout(syncT);await api('logout','POST',{});uname=null;saved=[];docSt={};try{localStorage.removeItem('us_saved');localStorage.removeItem('us_docs')}catch(e){}rUa();rS();if(cur==='detail'&&curDet)detail(curDet)}}else{$('#bl').onclick=()=>od(false);$('#br').onclick=()=>od(true)}}
function od(r){reg=r;$('#dt').textContent=t(r?'regT':'loginT');$('#dn').style.display=r?'':'none';$('#de').textContent='';$('#up').autocomplete=r?'new-password':'current-password';dg.showModal()}
$('#dx').onclick=()=>dg.close();
$('#df').onsubmit=async e=>{e.preventDefault();const em=$('#ue').value.trim(),pw=$('#up').value,nm=$('#un').value.trim(),btn=e.submitter;
if(reg&&!nm)return $('#de').textContent=t('eName');if(!/^\S+@\S+\.\S+$/.test(em))return $('#de').textContent=t('eMail');if(pw.length<8)return $('#de').textContent=t('ePass');
$('#de').textContent='';if(btn)btn.disabled=true;
const r=await api(reg?'register':'login','POST',reg?{name:nm,email:em,password:pw}:{email:em,password:pw});
if(btn)btn.disabled=false;
if(!r.ok||!r.data.user){$('#de').textContent=t(ERRK[r.data&&r.data.error]||'eNet');return}
dg.close();uname=r.data.user.name||em.split('@')[0];$('#up').value='';rUa();await loadAccount(true)};

setLang('en');
api('me').then(r=>{if(r.ok&&r.data.user){uname=r.data.user.name||r.data.user.email.split('@')[0];rUa();loadAccount(false)}});
</script></body></html>
